    (function(){
      if(window.__LJR_PERMISSION_SELECTOR_HARD_GUARD_V681__) return;
      window.__LJR_PERMISSION_SELECTOR_HARD_GUARD_V681__=true;
      var lastKey='',lastAt=0;
      function route(){
        return String(location.hash||'').replace(/^#\/?/,'').split('?')[0]||
          String(document.body&&document.body.dataset&&document.body.dataset.appRoute||'home');
      }
      function stop(e){
        e.preventDefault();
        e.stopPropagation();
        if(typeof e.stopImmediatePropagation==='function')e.stopImmediatePropagation();
      }
      function handle(e){
        if(route()!=='permissionBuilder'||!(e.target instanceof Element))return;
        var t=e.target;
        var hit=t.closest(
          '[data-v635-team-open],[data-v635-team-choice],[data-v635-team-close],'+
          '[data-v635-player-open],[data-v635-player-choice],[data-v635-player-close]'
        );
        if(!hit)return;
        var api=window.LJR_PERMISSION_BUILDER_API;
        if(!api)return;
        stop(e);
        var key='';
        if(hit.hasAttribute('data-v635-team-choice'))key='team:'+String(hit.dataset.v635TeamChoice||'');
        else if(hit.hasAttribute('data-v635-team-open'))key='team-open';
        else if(hit.hasAttribute('data-v635-team-close'))key='team-close';
        else if(hit.hasAttribute('data-v635-player-choice'))key='player:'+String(hit.dataset.v635PlayerChoice||'');
        else if(hit.hasAttribute('data-v635-player-open'))key='player-open';
        else if(hit.hasAttribute('data-v635-player-close'))key='player-close';
        var now=Date.now();
        if(key&&key===lastKey&&now-lastAt<420)return;
        lastKey=key;lastAt=now;
        if(hit.hasAttribute('data-v635-team-choice'))api.chooseTeam?.(hit.dataset.v635TeamChoice||'');
        else if(hit.hasAttribute('data-v635-team-open'))api.openTeamPicker?.();
        else if(hit.hasAttribute('data-v635-team-close'))api.closeTeamPicker?.();
        else if(hit.hasAttribute('data-v635-player-choice'))api.choosePlayer?.(hit.dataset.v635PlayerChoice||'');
        else if(hit.hasAttribute('data-v635-player-open'))api.openPlayerPicker?.(e);
        else if(hit.hasAttribute('data-v635-player-close'))api.closePlayerPicker?.(e);
      }
      /* V1054: una sola activación por toque; pointerup abría el modal antes del click
         y podía cerrarlo inmediatamente sobre el fondo en Chrome Android. */
      window.addEventListener('click',handle,true);
    })();
  </script>

  <script>
    (function () {
      const mode = new URLSearchParams(location.search).get('mode') || '';
      const html = document.documentElement;
      const smallTouchscreen = navigator.maxTouchPoints > 0 &&
        Math.min(Number(screen.width)||1366,Number(screen.height)||1366) < 700;
      if (mode === 'desktop') {
        html.classList.add('preview-desktop');
        const viewport = document.querySelector('meta[name="viewport"]');
        // Chrome Android must not shrink an entire 1366px desktop into the phone viewport.
        if (smallTouchscreen) {
          html.classList.add('ljpc-compact-phone');
          if (viewport) viewport.setAttribute('content','width=device-width, initial-scale=1.0, viewport-fit=cover');
        } else if (viewport) viewport.setAttribute('content', 'width=1366, initial-scale=1.0');
      } else if (mode === 'mobile' || mode === 'apk') {
        html.classList.add('preview-mobile');
        if (mode === 'apk') html.classList.add('preview-apk');
      }
      // Desktop solicitado: mantener una interfaz PC real también en Chrome Android.
      // El modo móvil y APK conservan intactos el viewport y los estilos originales.
      if (mode === 'desktop') {
        html.classList.add('ljpc-forced-desktop');
        const useDesktop = () => document.body && document.body.classList.add('lj-desktop');
        if (document.body) useDesktop();
        else document.addEventListener('DOMContentLoaded',useDesktop,{once:true});
      }
      html.dataset.previewMode = mode || 'auto';
    })();
  </script>

  (function(){
    if(window.__LJR_V577_MONITO_HARD_OPEN__)return;
    window.__LJR_V577_MONITO_HARD_OPEN__=true;
    var lastOpen=0;
    function currentRoute(){
      return String(location.hash||'').replace(/^#\/?/,'').split('?')[0]||'home';
    }
    function openGallery(){
      var now=Date.now();
      if(now-lastOpen<350)return;
      lastOpen=now;
      try{
        if(window.LJR_APP_ROUTER&&typeof window.LJR_APP_ROUTER.go==='function'){
          window.LJR_APP_ROUTER.go('moreLessGallery');
        }else{
          location.hash='#/moreLessGallery';
        }
      }catch(_){
        location.hash='#/moreLessGallery';
      }
      /* Respaldo para navegadores Android donde otro listener reescribe el hash. */
      setTimeout(function(){
        if(currentRoute()!=='moreLessGallery')location.hash='#/moreLessGallery';
      },40);
    }
    function isMonito(e){
      if(currentRoute()!=='moreLess'||!(e.target instanceof Element))return false;
      var primary=e.target.closest('#screen [data-v12-moreless]');
      if(!primary)return false;
      var hit=e.target.closest(
        '.v12-ml-choice > button:not(.up-arrow):not(.down-arrow), .v12-ml-choice > button:not(.up-arrow):not(.down-arrow) .v12-avatar, .v12-avatar'
      );
      if(!hit||!primary.contains(hit))return false;
      var btn=hit.closest('button');
      if(btn&&(btn.classList.contains('up-arrow')||btn.classList.contains('down-arrow')))return false;
      return true;
    }
    function handle(e){
      if(!isMonito(e))return;
      e.preventDefault();
      e.stopPropagation();
      if(typeof e.stopImmediatePropagation==='function')e.stopImmediatePropagation();
      openGallery();
    }
    /* Captura antes que los handlers viejos: funciona con toque Android, mouse y click. */
    document.addEventListener('pointerup',handle,true);
    document.addEventListener('touchend',handle,{capture:true,passive:false});
    document.addEventListener('click',handle,true);
  })();

      var root=document.documentElement;
      var screen=document.querySelector('#screen');
      var ready=document.readyState!=='loading';
      var lastChange=performance.now();
      var released=false,watch=null,checkTimer=0;
      function hasRealContent(){
        if(!screen||!screen.children.length)return false;
        var first=screen.firstElementChild;
        /* Avoid revealing placeholder containers while the original route
           design has not yet replaced them. */
        if(screen.children.length===1&&first&&
          (first.hasAttribute('data-ljr-reference-mount')||
           (first.attributes.length===1&&/^data-v\d+.*-mount$/.test(first.attributes[0].name)))){
          return false;
        }
        return screen.children.length>0||(screen.textContent||'').trim().length>0;
      }
      function reveal(){
        if(released)return;
        released=true;
        clearTimeout(checkTimer);
        watch?.disconnect();
        root.classList.remove('ljr-preboot');
      }
      function check(){
        if(released||!ready||!hasRealContent())return;
        if(performance.now()-lastChange>=130)reveal();
        else checkTimer=setTimeout(check,145);
      }
      function schedule(){
        lastChange=performance.now();
        clearTimeout(checkTimer);
        checkTimer=setTimeout(check,150);
      }
      if(screen){
        watch=new MutationObserver(schedule);
        watch.observe(screen,{childList:true});
      }
      if(!ready)document.addEventListener('DOMContentLoaded',function(){
        ready=true;schedule();
      },{once:true});
      else schedule();
      window.addEventListener('load',check,{once:true});
      /* Even after a failed module, never leave the app invisible forever. */
      setTimeout(reveal,2400);
    })();

  <script>
    (function(){
      if(window.__LJR_V912_PRONOSTICA_ACTIONS_CENTER_AND_DOTS__)return;
      window.__LJR_V912_PRONOSTICA_ACTIONS_CENTER_AND_DOTS__=true;

      function route(){
        return String(location.hash||'').replace(/^#\/?/,'').split('?')[0]||
          String(document.body&&document.body.dataset&&document.body.dataset.appRoute||'home');
      }
      function imp(el,name,value){
        if(el)el.style.setProperty(name,value,'important');
      }
      function sync(){
        if(route()!=='predictorSix')return;
        var page=document.querySelector('#screen .v589-page.intro');
        if(!page)return;

        var actions=page.querySelector('.v589-intro-actions');
        var dots=page.querySelector('.v589-dots');
        var copy=page.querySelector('.v589-intro-copy');
        var small=window.matchMedia&&window.matchMedia('(max-width:420px)').matches;

        if(actions){
          imp(actions,'position','absolute');
          imp(actions,'left','50%');
          imp(actions,'right','auto');
          imp(actions,'bottom',small?'54px':'64px');
          imp(actions,'width',small?'min(calc(100% - 44px),360px)':'min(calc(100% - 56px),430px)');
          imp(actions,'max-width',small?'360px':'430px');
          imp(actions,'margin','0');
          imp(actions,'padding','0');
          imp(actions,'transform','translateX(-50%)');
          imp(actions,'display','grid');
          imp(actions,'grid-template-columns','1fr');
          imp(actions,'gap','12px');
          imp(actions,'z-index','40');

          actions.querySelectorAll('button').forEach(function(btn){
            imp(btn,'width','100%');
            imp(btn,'min-width','0');
            imp(btn,'max-width','none');
            imp(btn,'margin','0');
            imp(btn,'display','flex');
            imp(btn,'align-items','center');
            imp(btn,'justify-content','center');
            imp(btn,'text-align','center');
          });
        }

        if(dots){
          imp(dots,'position','static');
          imp(dots,'left','auto');
          imp(dots,'right','auto');
          imp(dots,'bottom','auto');
          imp(dots,'top','auto');
          imp(dots,'width','max-content');
          imp(dots,'height','10px');
          imp(dots,'margin',small?'14px auto 0':'18px auto 0');
          imp(dots,'padding','0');
          imp(dots,'display','flex');
          imp(dots,'align-items','center');
          imp(dots,'justify-content','center');
          imp(dots,'gap','9px');
          imp(dots,'transform','none');
        }

        if(copy){
          imp(copy,'padding-bottom',small?'174px':'190px');
        }
      }

      var queued=false;
      function queue(){
        if(queued)return;
        queued=true;
        requestAnimationFrame(function(){queued=false;sync()});
      }
      window.addEventListener('hashchange',queue);
      window.addEventListener('resize',queue);
      document.addEventListener('DOMContentLoaded',queue,{once:true});
      var screen=document.getElementById('screen');
      if(screen)new MutationObserver(queue).observe(screen,{childList:true,subtree:true});
      queue();
      setTimeout(sync,250);
      setTimeout(sync,900);
    })();
  </script>

  <link rel="stylesheet" href="./src/v918-transfers-visible-header.css?v=20261007-v918-visible-name-bell">
  <script>
  (function(){
    if(window.__LJR_V918_TRANSFER_HEADER__)return;
    window.__LJR_V918_TRANSFER_HEADER__=true;
    var pending=false;
    function inFichajes(){
      var path=String(location.hash||''); return (path.startsWith('#/')?path.slice(2):path.replace('#','')).split('?')[0]==='transfers';
    }
    function align(){
      pending=false;
      if(!inFichajes())return;
      var header=document.querySelector('#app > .topbar');
      var profile=header&&header.querySelector('.profile-button');
      if(!header||!profile)return;
      var rect=header.getBoundingClientRect();
      var anchor=profile.getBoundingClientRect();
      if(rect.width>0&&anchor.width>0&&anchor.height>0){
        var top=Math.round(anchor.top-rect.top+anchor.height/2);
        var right=Math.round(rect.right-anchor.right);
        header.style.setProperty('--v918-control-top',top+'px');
        header.style.setProperty('--v918-profile-right',Math.max(0,right)+'px');
      }
      window.LJR_SCROLL_CHROME?.refresh?.();
    }
    function queue(){if(pending)return;pending=true;requestAnimationFrame(align);}
    document.addEventListener('click',function(e){
      if(!(e.target instanceof Element))return;
      var bell=e.target.closest('#v918TransferBell');
      if(!bell||!inFichajes())return;
      e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
      if(typeof window.LJR_MAIN_ROUTE?.go==='function')window.LJR_MAIN_ROUTE.go('notifications');
      else location.hash='#/notifications';
    },true);
    window.addEventListener('hashchange',queue);
    window.addEventListener('resize',queue);
    window.addEventListener('load',queue);
    document.addEventListener('DOMContentLoaded',queue,{once:true});
    queue();setTimeout(queue,450);setTimeout(queue,1250);
  })();
  </script>
