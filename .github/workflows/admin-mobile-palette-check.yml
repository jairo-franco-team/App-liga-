name: Revisar paleta de Administración en Android

on:
  push:
    branches: [main]
    paths:
      - 'src/v1310-admin-paleta-unificada.css'
      - 'src/v1335-admin-app-colors.css'
      - 'src/v1340-admin-mobile-visual-unified.css'
      - 'src/v1246-content-studio.css'
      - 'src/v1381-admin-colores-oficiales.css'
      - 'src/v1384-admin-visual-dark-harmony.css'
      - 'src/v1232-suspension-official-blue.css'
      - 'tests/v1385-admin-palette-regression.test.mjs'
      - 'tests/admin-palette-android-v1353.mjs'
      - 'src/v1420-reference-blue-surfaces.css'
      - 'src/v1437-jr-tools-royal-blue-image2.css'
      - 'public/reference-ui/**'
      - 'tests/v1440-drive-background-variety.mjs'
      - 'tests/v1441-captured-design.mjs'
      - 'tests/v1460-mobile-corrections.mjs'
      - 'tests/mobile-clean-boot.mjs'
      - 'tests/mobile-no-legacy-flash.test.mjs'
      - 'tests/onboarding-mobile-v1460.mjs'
      - 'src/mobile-list-pages-20261011.*'
      - 'src/apk-first-install*'
      - 'src/v1455-account-uefa-compact.*'
      - 'src/v776-navigation.js'
      - 'src/v840-apk-match-notifications.js'
      - 'index.html'
      - 'src/v1441-captured-design.js'
      - 'src/v1441-captured-design.css'
      - 'src/v1442-picture-in-picture.*'
      - 'src/reference-icons.js'
      - 'tests/picture-in-picture-controls.test.mjs'
      - 'tests/v1420-reference-blue-mobile.mjs'
      - 'tests/v1421-royal-drive-pages.mjs'
      - 'tests/v1422-complete-sections.mjs'
      - 'src/v164-history-log.js'
      - '.github/workflows/admin-mobile-palette-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-palette-mobile-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify-admin-mobile:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium test tooling
        run: |
          npm install --no-save playwright --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check Android viewport colors and controls
        run: node tests/admin-palette-android-v1353.mjs
      - name: Check reference blue dialogs and preserved controls
        run: node tests/v1420-reference-blue-mobile.mjs
      - name: Complete repository unit tests
        run: node --test tests/*.test.mjs
      - name: Build compiled app
        id: compiled
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Check complete captured sections and untouched screens
        if: ${{ !cancelled() && steps.compiled.outcome == 'success' }}
        run: node tests/v1441-captured-design.mjs
      - name: Check mobile surfaces, pagination and return
        if: ${{ !cancelled() && steps.compiled.outcome == 'success' }}
        run: node tests/v1460-mobile-corrections.mjs
      - name: Check initial paint and delegated route loading
        if: ${{ !cancelled() && steps.compiled.outcome == 'success' }}
        run: node tests/mobile-clean-boot.mjs
      - name: Check APK first installation
        if: ${{ !cancelled() && steps.compiled.outcome == 'success' }}
        run: node tests/onboarding-mobile-v1460.mjs
      - name: Check visible forward and back animation
        if: ${{ !cancelled() && steps.compiled.outcome == 'success' }}
        run: node tests/navigation-motion.mjs
      - name: Check protected original headers
        if: ${{ !cancelled() && steps.compiled.outcome == 'success' }}
        run: node tests/v1438-protected-headers.mjs
      - name: Keep mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-mobile-v1353
          path: |
            artifacts/admin-mobile-v1353/*.png
            artifacts/v1420-reference-blue/*.png
            artifacts/v1421-royal-pages/*.png
            artifacts/v1422-complete-sections/*.png
            artifacts/v1440/*.png
            artifacts/v1441/*.png
            artifacts/v1460/*.png
            artifacts/v1460-onboarding/*.png
            artifacts/mobile-clean-boot/*
          if-no-files-found: ignore
          retention-days: 14
