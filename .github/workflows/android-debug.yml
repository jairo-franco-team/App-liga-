name: Build Android Debug APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - skywork-rebuild-v1
    paths-ignore:
      - 'demo/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main

# Con pushes frecuentes, cancelar la compilación en curso impide crear la APK.
# Dejar terminar una ejecución, con solo la más reciente pendiente en la cola.
# Las ejecuciones manuales conservan su grupo propio para no bloquearse.
concurrency:
  group: android-debug-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Optimize APK media copies without changing artwork or URLs
        run: node scripts/optimize-apk-media.mjs dist

      - name: Create Android project
        run: npx cap add android

      - name: Apply corrected full-blue Liga Juventino app icon
        run: |
          mkdir -p assets
          test -s assets/icon.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#02065F' --iconBackgroundColorDark '#02065F'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Validate native APK features
        run: node --test tests/calendar-event.test.mjs tests/android-video-capture.test.mjs tests/android-fcm-preflight.test.mjs tests/android-fcm-conditional-setup.test.mjs tests/android-asset-dedup.test.mjs

      - name: Check Firebase Android readiness without exposing credentials
        env:
          FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_CONFIG_B64 }}
        run: node scripts/android-fcm-preflight.mjs

      - name: Configure native APK features and version
        env:
          LJR_VERSION_CODE: ${{ github.run_number }}
        run: node native/android/configure.mjs

      - name: Prepare optional Firebase SDK (never auto-enroll devices)
        env:
          FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_CONFIG_B64 }}
        run: node native/android/configure-fcm.mjs

      - name: Build baseline debug APK for exact size comparison
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug)
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/liga-baseline.apk"

      - name: Store identical Android images once and preserve every original URL
        run: node native/android/prepare-assets.mjs

      - name: Build optimized debug APK
        run: |
          node native/android/prepare-assets.mjs --verify-only
          # APKflinger incremental deletion retains virtual ZIP entries/padding.
          # Recreate the package so removed images reduce the actual download size.
          (cd android && ./gradlew clean assembleDebug)

      - name: Verify all original asset bytes in APK and measure actual reduction
        run: python native/android/verify-apk-assets.py --apk android/app/build/outputs/apk/debug/app-debug.apk --baseline "$RUNNER_TEMP/liga-baseline.apk"

      - name: Verify compiled mobile app against the actual optimized Android assets
        run: |
          npm install --no-save playwright --no-audit --no-fund
          npx playwright install --with-deps chromium
          ANDROID_PUBLIC_DIR=android/app/src/main/assets/public node tests/mobile-clean-boot.mjs
          node tests/navigation-motion.mjs
          node tests/mobile-shell.mjs
          node tests/mobile-reference-corrections.mjs

      - name: Upload measured Android asset inventory
        uses: actions/upload-artifact@v4
        with:
          name: Liga-Juventino-Android-Size-Report
          path: |
            android-asset-report.json
            android-media-optimization.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Liga-Juventino-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable APK download
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Liga-Juventino.apk
          APP_BUILD=$(sed -n 's/.*<meta name="app-build" content="\([^"]*\)".*/\1/p' index.html | head -n1)
          NOTES="APK Android de Liga Juventino actualizado automáticamente desde main. Build: ${APP_BUILD:-desconocido}. Commit: ${GITHUB_SHA}. Incluye las funciones nativas actuales, entre ellas creación automática de partidos en Google Calendar. Estado de Push remoto APK: ${LJR_APK_FCM_STATUS:-pendiente de configuración y prueba en Android}."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest Liga-Juventino.apk --clobber
            gh release edit android-latest --title "Liga Juventino Android" --notes "$NOTES"
          else
            gh release create android-latest Liga-Juventino.apk \
              --title "Liga Juventino Android" \
              --notes "$NOTES"
          fi
